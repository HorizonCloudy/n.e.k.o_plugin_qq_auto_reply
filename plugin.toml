[plugin]
name = "QQ集成"
description = "通过 OneBot v11（正向/反向 WebSocket，兼容 SnowLuma / NapCat / LLOneBot / go-cqhttp / Lagrange 等任意 OneBot 后端）或 QQ 官方开放平台接入 QQ。支持多群注意力竞争、接话判定（谁在跟谁说话：@/引用/点名/时序）、动态回复缓冲、文件内容读取（文本/VLM 图片描述）、多模态输出、提示词编辑、戳一戳、表情包、其它插件工具桥（按分档让她调用别的插件）、管理员私聊的主动搭话（有由头才开口）等功能。官方机器人（开放平台）按 API v2 实现：全量群消息、语音/视频/文件富媒体、引用回复、撤回、@ 成员与 @ 全体、按钮键盘、群资料与成员名册、禁言/移出/入群审批、自定义菜单与指令面板；平台没有的操作（戳一戳、群/单聊表情表态、读历史消息）明确报错。"
short_description = "完整 QQ 机器人集成：OneBot v11 泛用连接（正向/反向）/ 官方开放平台 API v2 全能力面（全量群消息、语音/视频/文件、引用、撤回、群管理与菜单）、注意力管理、接话判定、文件内容读取、多模态交互"
keywords = ["qq", "onebot", "onebot-v11", "snowluma", "napcat", "llonebot", "go-cqhttp", "lagrange", "qq-open-platform", "qq-openapi-v2", "official-bot", "open-platform-api-v2", "auto-reply", "chat", "attention", "addressee", "sticker", "poke", "voice", "buffer", "file", "vlm", "forward-websocket", "reverse-websocket", "plugin-bridge", "proactive"]
passive = true
version = "0.15.13"
id = "qq_auto_reply"
type = "plugin"
entry = "plugin.plugins.qq_auto_reply:QQAutoReplyPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.store]
enabled = false

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "Hello QQ"
entry = "static/index.html"
context = "qq_auto_reply"
permissions = ["state:read", "action:call"]

[plugin_runtime]
enabled = true
auto_start = false
